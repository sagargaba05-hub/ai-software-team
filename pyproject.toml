[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-software-team"
version = "0.1.0"
description = "Reusable LangGraph software delivery team with shared Codex skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "GitPython>=3.1,<4",
  "langgraph>=1.0,<2",
  "mcp>=1.26,<2",
  "openai>=2,<3",
  "pydantic>=2.8,<3",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_team"]
